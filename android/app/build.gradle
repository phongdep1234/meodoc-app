plugins {
    id 'com.android.application'
}

android {
    namespace 'com.phong.cuuam'
    compileSdk 34

    defaultConfig {
        applicationId 'com.phong.cuuam'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        release {
            // Khoá ký tự tạo (cuuam.jks) để cài/cập nhật APK release ngoài Play Store
            storeFile file('cuuam.jks')
            storePassword 'cuuam123'
            keyAlias 'cuuam'
            keyPassword 'cuuam123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    sourceSets {
        main.assets.srcDirs += ['../../shared']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
